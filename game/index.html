<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rasgulla Run — रसगुल्ला रन | MB Sweets, Darbhanga</title>
<meta name="description" content="Rasgulla Run — a sweet Mithila chase. Run through Darbhanga's painted streets with Golu, grab rasgullas and escape the bees! by MB Sweets (Maa Bhagwati Mishthan Bhandar), Nanaura Chowk, Darbhanga.">
<meta name="theme-color" content="#7A111A">
<meta property="og:title" content="Rasgulla Run — रसगुल्ला रन">
<meta property="og:description" content="मिथिला की मीठी दौड़ — गोलू के साथ दौड़ो, रसगुल्ले लूटो, मधुमक्खियों से बचो!">
<meta property="og:image" content="https://mbsweets.github.io/game/img/og.jpg">
<link rel="icon" href="img/logo.webp">
<style>
@font-face{font-family:"Baloo 2";src:url(fonts/baloo2-800.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Mukta;src:url(fonts/mukta-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:Mukta;src:url(fonts/mukta-700.woff2) format("woff2");font-weight:700;font-display:swap}
:root{--ink:#2A1511;--sindoor:#D1261C;--haldi:#F2A91B;--gold:#E2B14A;--cream:#FFF6E3;--maroon:#7A111A;--leaf:#2E7B47;--pink:#D8457F;
  --disp:"Baloo 2","Mukta",system-ui,sans-serif;--body:Mukta,system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
#leaveS{z-index:60}
#langS{z-index:55}
#rateS{z-index:58}
#profS{z-index:56}
#chalS{z-index:57}
.sm.story{background:linear-gradient(#ffe7b8,#f5b85a)}.sm.story small{color:#6b2a10}
#menu{overflow-y:auto;overflow-x:hidden}
@media (max-height: 720px) and (max-aspect-ratio: 1/1){#menu .titlewrap{margin-top:2px}#menu .ttl{font-size:clamp(40px,11.5vw,70px)}#menu .panel{gap:8px}#menu .big{padding:7px 14px 4px}#menu .stats b{font-size:20px}#menu .sub.fest{display:none}}
#storyS{z-index:7}.stlist{align-self:stretch;overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px}
.stch{display:flex;align-items:center;gap:10px;text-align:left;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;box-shadow:0 3px 0 var(--ink);font:800 17px/1.15 var(--disp);color:var(--ink)}
.stch b{font-size:30px;width:40px;text-align:center}.stch span{flex:1;min-width:0}.stch em{display:block;font:700 12px var(--body);font-style:normal;color:var(--sindoor)}
.stch small{display:block;font:600 13px/1.2 var(--body);color:#6b4a3a}.stch i{font:800 14px var(--disp);font-style:normal;color:var(--maroon);white-space:nowrap}
.stch.done{background:#E9F8E4}.stch.lock{opacity:.5;box-shadow:none}
#cutS{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:space-between;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
  background:linear-gradient(#000 0 7vh,transparent 7vh 62%,rgba(42,21,17,.5) 100%)}
#cutS::after{content:'';position:absolute;left:0;right:0;bottom:0;height:0}
.cuttop{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#FFE7A8;font:800 16px var(--disp)}
#cutSkip{font:800 14px var(--disp);background:#fff3;color:#fff;border:2px solid #fff8;border-radius:99px;padding:4px 12px 2px}
.cutbox{width:min(100%,520px);align-self:center;background:var(--cream);border:4px solid var(--ink);border-radius:18px;padding:10px 14px 12px;box-shadow:inset 0 0 0 3px var(--haldi),0 6px 0 var(--ink);display:flex;flex-direction:column;gap:6px;animation:pop .35s}
#cutWho{font:800 18px var(--disp);color:var(--maroon)}#cutSay{font:600 clamp(16px,4.6vw,20px)/1.35 var(--body);min-height:3.9em}
#cutNext{align-self:flex-end;width:auto}
.bcrow{display:flex;gap:6px;margin-top:4px}.bcrow input{flex:1;min-width:0;font:800 20px var(--disp);letter-spacing:2px;text-transform:uppercase;padding:6px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff8e6}
.bcrow .sm{flex:none}.bcmsg{font:700 14px/1.3 var(--body);margin-top:6px}.bcmsg.ok{color:var(--leaf)}.bcmsg.bad{color:var(--sindoor)}
.chalg{font-size:64px;line-height:1;animation:unbob 1.4s ease-in-out infinite alternate}
.sm.daily{display:flex;flex-direction:column;align-items:center;gap:1px;background:linear-gradient(#cfe8ff,#8fc3f5);padding:6px 10px 5px}
.sm.daily b{font:800 17px/1.1 var(--disp)}
.sm.daily small{font:700 12px/1.2 var(--body);color:#1d3a6b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
/* 🎨 मधुबनी शक्ति का बॉर्डर */
#mbFrame{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .45s;
  background:radial-gradient(circle at 0 0,#f2a91b 0 26px,#c4161c 26px 31px,#2a1511 31px 34px,transparent 35px),radial-gradient(circle at 100% 0,#f2a91b 0 26px,#c4161c 26px 31px,#2a1511 31px 34px,transparent 35px),
    radial-gradient(circle at 0 100%,#f2a91b 0 26px,#c4161c 26px 31px,#2a1511 31px 34px,transparent 35px),radial-gradient(circle at 100% 100%,#f2a91b 0 26px,#c4161c 26px 31px,#2a1511 31px 34px,transparent 35px),
    repeating-linear-gradient(90deg,#c4161c 0 12px,#f2a91b 12px 24px,#2e7b47 24px 36px) top/100% 9px no-repeat,repeating-linear-gradient(90deg,#c4161c 0 12px,#f2a91b 12px 24px,#2e7b47 24px 36px) bottom/100% 9px no-repeat,
    repeating-linear-gradient(0deg,#c4161c 0 12px,#f2a91b 12px 24px,#2e7b47 24px 36px) left/9px 100% no-repeat,repeating-linear-gradient(0deg,#c4161c 0 12px,#f2a91b 12px 24px,#2e7b47 24px 36px) right/9px 100% no-repeat;
  box-shadow:inset 0 0 0 9px transparent,inset 0 0 0 12px #2a1511,inset 0 0 0 17px #fbf0d6,inset 0 0 0 19px #2a1511}
#mbFrame.on{opacity:1}
.sub.fest{background:var(--maroon);color:#FFE7A8;font-size:clamp(13px,3.6vw,16px);margin-top:6px;max-width:92vw}
.pf{align-self:stretch;display:flex;flex-direction:column;gap:3px;font:700 14px var(--body);text-align:left}
.pf input,.pf select{font:600 17px var(--body);padding:9px 10px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
#pfMsg:empty{display:none}
/* 🛵 डिलीवरी का कार्ड */
#order{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 100px);transform:translateX(-50%);width:min(66vw,280px);background:#fffaf0f2;border:3px solid var(--ink);border-radius:16px;
  padding:5px 9px 6px;box-shadow:0 4px 0 var(--ink);display:flex;flex-direction:column;gap:4px;pointer-events:none}
#order .oh{display:flex;align-items:center;gap:6px}
#order .oa{font-size:24px;line-height:1}
#order .on{flex:1;min-width:0;font:800 15px/1.1 var(--disp);color:var(--maroon);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#order .os{font-size:12px;letter-spacing:-1px;white-space:nowrap}
#order .oc{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
#order .oc span{display:inline-flex;align-items:center;gap:4px;background:#fff;border:2px solid var(--ink);border-radius:99px;padding:1px 8px 0 3px;font:700 13px/1.2 var(--body);white-space:nowrap}
#order .oc span b{font:800 14px var(--disp)}
#order .oc i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
#order .oc span.ok{background:#E9F8E4;border-color:var(--leaf)}
#order .oc span.just{animation:pop .3s}
#order .ot{height:7px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;background:#f3e6c8}
#order .ot b{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--leaf),var(--haldi))}
#order .ot b.low{background:var(--sindoor)}
#order .ol{display:flex;gap:6px;justify-content:center}
#order .ol span{width:44px;height:28px;border:2.5px solid var(--ink);border-radius:8px;background:#fff;display:grid;place-items:center;font-size:16px}
#order .ol span.t{background:var(--haldi);animation:pulse .45s ease-in-out infinite alternate}
#order .ol span.me:not(.t){background:#f3e6c8}
#order.pop{animation:opop .4s}
@keyframes opop{0%{transform:translateX(-50%) scale(.5)}70%{transform:translateX(-50%) scale(1.08)}100%{transform:translateX(-50%) scale(1)}}
#order.shake{animation:oshake .4s}
@keyframes oshake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 8px))}75%{transform:translateX(calc(-50% + 8px))}}
body.hasOrder #combo{top:calc(max(10px,env(safe-area-inset-top)) + 178px)}
body.hasOrder #toast{top:33%}
/* उड़ते अंक (करतब) */
.ftxt{position:absolute;left:50%;top:52%;transform:translate(-50%,0);font:800 clamp(22px,6vw,30px) var(--disp);color:#FFE45C;-webkit-text-stroke:5px var(--ink);paint-order:stroke fill;pointer-events:none;z-index:4;animation:ftxt .9s ease-out forwards}
@keyframes ftxt{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}20%{opacity:1;transform:translate(-50%,0) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60px) scale(1)}}
/* ⭐ राय */
.orate{display:flex;align-items:center;gap:8px;width:100%;background:#fff3cf;border:3px solid var(--ink);border-radius:14px;padding:6px 8px 4px 12px;font:800 15px/1.1 var(--disp)}
.orate span{white-space:nowrap}
.ostars{display:flex;gap:0;flex:1;min-width:0;justify-content:center}
.orate .ox{flex:none;padding:4px 2px}
.ost,.rst{background:none;border:0;color:#d8c7a2;font-size:clamp(22px,7.2vw,30px);line-height:1;padding:0 2px;cursor:pointer;text-shadow:0 2px 0 var(--ink);transition:transform .12s}
.ost:active,.rst:active{transform:scale(1.25)}
.rst{font-size:clamp(40px,11vw,52px)}
.ost.on,.rst.on{color:#ffc21a}
.rst.pop{animation:rpop .35s ease}
@keyframes rpop{0%{transform:scale(1)}45%{transform:scale(1.45) rotate(-8deg)}100%{transform:scale(1)}}
.ox,.rx{background:none;border:0;font:800 18px var(--disp);color:var(--ink);opacity:.6;padding:4px 6px}
.rcard{position:relative;max-height:92vh;overflow:auto}
.rx{position:absolute;right:8px;top:6px}
.rstars{display:flex;justify-content:center;gap:4px;margin-top:4px}
.rlbl{min-height:24px;font:800 20px var(--disp);color:var(--maroon);text-align:center}
.rtq{font:800 16px var(--disp);margin:6px 0 4px;text-align:center}
.rtags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px}
.rtag{font:700 14px/1.1 var(--body);background:#fff;border:2px solid var(--ink);border-radius:20px;padding:7px 11px 5px;box-shadow:0 3px 0 var(--ink)}
.rtag.on{background:var(--haldi);transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
#rText{width:100%;font:16px/1.3 var(--body);border:2px solid var(--ink);border-radius:12px;padding:8px 10px;resize:none;background:#fff;color:var(--ink)}
.rok{font-size:54px;text-align:center;animation:rpop .5s ease}
#rForm,#rDone{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
#rMore{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
#rDone[hidden],#rForm[hidden]{display:none}
.big.lgb{display:flex;flex-direction:column;align-items:center;gap:2px}
.big.lgb small{font:600 14px/1.1 var(--body);opacity:.9;letter-spacing:0}
/* ट्यूटोरियल: चलता हाथ दिखाए कि उँगली किधर खिसकानी है */
#hint{display:flex;flex-direction:column;align-items:center;gap:6px}
#hint .hand{display:block;font-size:clamp(40px,11vw,58px);line-height:1;filter:drop-shadow(0 3px 0 rgba(0,0,0,.35))}
#hint .hand.lane{animation:hLane 1.1s ease-in-out infinite}
#hint .hand.jump{animation:hUp .9s ease-in infinite}
#hint .hand.roll{animation:hDown .9s ease-in infinite}
#hint .trk{display:block;font-size:clamp(18px,5vw,24px);letter-spacing:6px;color:var(--gold);opacity:.95}
@keyframes hLane{0%,100%{transform:translateX(-46px) rotate(-12deg)}50%{transform:translateX(46px) rotate(12deg)}}
@keyframes hUp{0%{transform:translateY(26px);opacity:.2}30%{opacity:1}100%{transform:translateY(-30px);opacity:0}}
@keyframes hDown{0%{transform:translateY(-26px) rotate(180deg);opacity:.2}30%{opacity:1}100%{transform:translateY(30px) rotate(180deg);opacity:0}}
/* शुगर रश / रोकने का बटन सिखाना */
.teach{animation:teach .7s ease-in-out infinite alternate!important;position:relative}
@keyframes teach{from{box-shadow:0 0 0 0 rgba(255,214,90,.95),0 6px 0 var(--ink)}to{box-shadow:0 0 0 14px rgba(255,214,90,0),0 6px 0 var(--ink)}}
#tBub{position:absolute;z-index:40;font:800 15px/1.15 var(--disp);color:var(--ink);background:#FFE07A;border:3px solid var(--ink);border-radius:12px;padding:6px 10px 4px;pointer-events:none;white-space:nowrap;box-shadow:0 4px 0 var(--ink)}
#fsHint{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);z-index:35;max-width:92vw;text-align:center;font:700 14px/1.25 var(--body);color:#fff;background:rgba(42,21,17,.82);border-radius:12px;padding:7px 12px;pointer-events:none}
.howto{width:100%;margin-top:6px}
html,body{height:100%;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;color:var(--ink);font-family:var(--body);
  background:url(img/sky.webp) center top/cover no-repeat,#FFE3A6}
@media (max-aspect-ratio: 1/1){html,body{background:url(img/sky.webp) 50% 0/auto 52% repeat-x,linear-gradient(#A9DCF0 0,#FFE3A6 52%,#FFE3A6 100%)}}
#app{position:fixed;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
#c{position:absolute;inset:0;width:100%;height:100%;display:block}
button{font-family:var(--disp);cursor:pointer;border:0;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid #fff;outline-offset:3px}

/* ---------- बटन (मधुबनी किनारी) ---------- */
.big{display:block;width:100%;font-size:clamp(26px,7vw,34px);font-weight:800;color:#fff;letter-spacing:.5px;background:var(--sindoor);
  border:4px solid var(--ink);border-radius:18px;padding:10px 18px 6px;box-shadow:inset 0 0 0 4px var(--haldi),inset 0 0 0 7px var(--sindoor),inset 0 0 0 9px #fff3,0 6px 0 var(--ink);
  text-shadow:0 2px 0 var(--ink);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:inset 0 0 0 4px var(--haldi),inset 0 0 0 7px var(--sindoor),0 2px 0 var(--ink)}
.sm{font-size:16px;font-weight:800;background:var(--cream);border:3px solid var(--ink);border-radius:14px;padding:7px 12px 4px;box-shadow:0 4px 0 var(--ink);flex:1}
.sm:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.row{display:flex;gap:10px;width:100%}

/* ---------- स्क्रीन ---------- */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.dim{background:rgba(42,21,17,.45);justify-content:center}
.brand{display:flex;align-items:center;gap:8px;font:800 15px var(--disp);color:var(--maroon);background:#fff8;border:2px solid var(--ink);border-radius:999px;padding:3px 14px 1px 4px}
.brand img{width:38px;height:auto}
.titlewrap{text-align:center;margin-top:10px;isolation:isolate}
.ttl{position:relative;display:inline-block;font:800 clamp(48px,14.5vw,96px)/1.05 var(--disp);color:var(--sindoor);z-index:0;white-space:nowrap}
.ttl::before,.ttl::after{content:attr(data-text);position:absolute;left:0;top:0;z-index:-1}
.ttl::before{color:var(--ink);-webkit-text-stroke:16px var(--ink);text-shadow:0 8px 0 var(--gold),0 9px 0 var(--ink)}
.ttl::after{color:#fff;-webkit-text-stroke:8px #fff}
.sub{display:inline-block;margin-top:6px;font:700 clamp(15px,4.2vw,20px) var(--body);color:#fff;background:var(--leaf);border:2.5px solid var(--ink);border-radius:999px;padding:2px 14px 0}
.spacer{flex:1}
.panel{width:min(100%,380px);display:flex;flex-direction:column;align-items:center;gap:12px}
.stats{display:flex;gap:10px;width:100%}
.stats>div{flex:1;background:#fffaf0e8;border:3px solid var(--ink);border-radius:14px;padding:4px 8px 2px;text-align:center}
.stats small{display:block;font:700 13px var(--body);color:var(--maroon)}
.stats b{font:800 24px/1.1 var(--disp)}
.tiny{font:700 13px var(--body);text-align:center;color:var(--ink);background:#fff9;border-radius:10px;padding:2px 10px}
.card{width:min(100%,380px);background:var(--cream);border:4px solid var(--ink);border-radius:22px;padding:22px 18px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;
  box-shadow:inset 0 0 0 6px var(--cream),inset 0 0 0 9px var(--sindoor),inset 0 0 0 11px var(--cream),inset 0 0 0 13px var(--haldi),0 8px 0 var(--ink);text-align:center}
.card h2{font:800 clamp(24px,6.5vw,30px)/1.15 var(--disp);color:var(--maroon)}
.big-score{font:800 58px/1 var(--disp);color:var(--sindoor);text-shadow:0 3px 0 var(--ink)}
.badge{font:800 18px var(--disp);color:#fff;background:var(--leaf);border:3px solid var(--ink);border-radius:999px;padding:2px 14px 0;animation:pop .6s ease-out}
.shopcard{margin-top:14px;width:min(100%,380px);display:flex;gap:12px;align-items:center;text-decoration:none;color:#fff;background:var(--maroon);border:3px solid var(--ink);border-radius:18px;
  padding:10px 14px;box-shadow:inset 0 0 0 3px var(--gold),0 5px 0 var(--ink)}
.shopcard img{width:62px;height:auto;flex:none}
.shopcard b{display:block;font:800 18px/1.2 var(--disp);color:#FFE7A8}
.shopcard small{display:block;font:700 13px var(--body)}
.shopcard em{display:inline-block;margin-top:5px;font:800 15px var(--disp);font-style:normal;background:var(--haldi);color:var(--ink);border-radius:999px;padding:2px 12px 0;border:2px solid var(--ink)}
#loading{justify-content:center;gap:16px;background:var(--maroon)}
#loading img{width:120px}
#loadbar{width:min(70vw,280px);height:14px;border:3px solid var(--ink);border-radius:99px;background:var(--cream);overflow:hidden}
#loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--haldi),var(--sindoor));transition:width .2s}
#loadmsg{color:#FFE7A8;font:700 16px var(--body)}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
#hud .top{position:absolute;left:0;right:0;top:0;display:flex;align-items:flex-start;gap:8px;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left))}
.ib{width:46px;height:46px;flex:none;border-radius:14px;background:var(--cream);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);font:800 18px var(--disp)}
#pu{flex:1;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.chip{display:flex;align-items:center;gap:6px;background:#fffaf0ee;border:2.5px solid var(--ink);border-radius:999px;padding:2px 10px 0 4px;font:700 14px var(--body)}
.chip b{font-size:18px}
.chip em{font:800 15px var(--disp);font-style:normal;color:#fff;background:var(--sindoor);border-radius:99px;padding:0 7px;min-width:26px;text-align:center}
.scorebox{text-align:right}
#scoreV{font:800 clamp(30px,8.5vw,42px)/1 var(--disp);color:#fff;-webkit-text-stroke:6px var(--ink);paint-order:stroke fill;text-shadow:0 3px 0 var(--ink)}
.sw{display:inline-flex;align-items:center;gap:6px;margin-top:4px;background:#fffaf0ee;border:2.5px solid var(--ink);border-radius:999px;padding:1px 12px 0 4px;font:800 20px var(--disp)}
.rg{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff 0 30%,#FFF4DC 31% 100%);border:2.5px solid var(--ink);display:inline-block}

  <section id="reviveS" class="screen dim" hidden>
    <div class="card">
      <h2 data-t="revT"></h2>
      <div id="revN" class="revn">6</div>
      <button id="revAd" class="big" data-t="revAd"></button>
      <button id="revPay" class="sm wide revpay"></button>
      <button id="revNo" class="sm wide" data-t="revNo"></button>
    </div>
  </section>

  <section id="lbS" class="screen dim" hidden>
    <div class="card lbcard">
      <h2 data-t="lb"></h2>
      <div id="lbTabs" class="seg"><button data-s="city"></button><button data-s="india" data-t="lbIndia"></button><button data-s="world" data-t="lbWorld"></button></div>
      <div id="lbPer" class="seg sm2"><button data-p="day" data-t="lbDay"></button><button data-p="week" data-t="lbWeek"></button><button data-p="all" data-t="lbAll"></button></div>
      <div id="lbForm" hidden>
        <label><span data-t="lbYourName"></span><input id="lbName" maxlength="16" autocomplete="nickname"></label>
        <label><span data-t="lbCityL"></span><select id="lbCity"></select></label>
        <p class="lbnote" data-t="lbPrivacy"></p><p id="lbMsg" class="lbnote warn"></p>
        <button id="lbSave" class="big" data-t="lbSave"></button>
      </div>
      <ol id="lbList"></ol>
      <div id="lbMe"></div>
      <div class="row"><button id="lbEdit" class="sm" data-t="lbEdit"></button><button id="lbClose" class="sm" data-t="lbClose"></button></div>
    </div>
  </section>

  <section id="rwS" class="screen dim" hidden>
    <div class="card lbcard rwcard">
      <h2 data-t="rwT"></h2>
      <div id="rwBody"></div>
      <button id="rwClose" class="sm wide" data-t="lbClose"></button>
    </div>
  </section>

  <section id="metaS" class="screen dim" hidden>
    <div class="card lbcard metacard">
      <div class="mhead"><div id="metaTabs" class="seg"><button data-m="ms" data-t="msT"></button><button data-m="bd" data-t="bdT"></button><button data-m="up" data-t="upT"></button><button data-m="set" data-t="setT"></button></div>
        <div id="metaWallet" class="sw"></div></div>
      <div id="metaBody"></div>
      <button id="metaClose" class="sm wide" data-t="lbClose"></button>
    </div>
  </section>

  <section id="wardS" class="wardsheet" hidden>
    <div class="wcard">
      <div class="mhead"><div id="wardTabs" class="seg"><button data-w="head" data-t="wHead"></button><button data-w="body" data-t="wBody"></button><button data-w="feet" data-t="wFeet"></button><button data-w="extra" data-t="wExtra"></button></div>
        <div id="wardWallet" class="sw"></div></div>
      <div id="wardGrid" class="wgrid"></div>
      <p id="wardNote" class="lbnote"></p>
      <button id="wardClose" class="sm wide" data-t="lbClose"></button>
    </div>
  </section>

  <section id="unlockS" class="screen dim" hidden>
    <div id="unConf" class="conf"></div>
    <div class="card unlockcard">
      <div class="unglow"></div>
      <small data-t="unTitle"></small>
      <div id="unIcon" class="unicon"></div>
      <h2 id="unName"></h2>
      <button id="unWear" class="big" data-t="unWear"></button>
      <button id="unLater" class="sm wide" data-t="unLater"></button>
    </div>
  </section>

  <section id="rateS" class="screen dim" hidden>
    <div class="card rcard">
      <button id="rateX" class="rx" aria-label="close">✕</button>
      <div id="rForm">
        <h2 data-t="rateQ"></h2>
        <div id="rStars" class="rstars"></div>
        <div id="rLbl" class="rlbl"></div>
        <div id="rMore" hidden>
          <p id="rTagQ" class="rtq"></p>
          <div id="rTags" class="rtags"></div>
          <textarea id="rText" maxlength="200" rows="2"></textarea>
          <p class="lbnote" data-t="ratePriv"></p>
          <button id="rSend" class="big" data-t="rateSend"></button>
        </div>
      </div>
      <div id="rDone" hidden>
        <div class="rok">🙏</div>
        <h2 id="rThanksT"></h2>
        <p id="rThanksP" class="lbnote"></p>
        <button id="rShare" class="big" data-t="share"></button>
      </div>
    </div>
  </section>

  <section id="storyS" class="screen dim" hidden>
    <div class="card lbcard"><h2 data-t="storyBtn"></h2><div id="storyList" class="stlist"></div><button id="storyClose" class="sm wide" data-t="lbClose"></button></div>
  </section>
  <section id="cutS" hidden>
    <div class="cuttop"><span id="cutT"></span><button id="cutSkip" data-t="storySkip"></button></div>
    <div class="cutbox"><b id="cutWho"></b><p id="cutSay"></p><button id="cutNext" class="big mini"></button></div>
  </section>
  <section id="chalS" class="screen dim" hidden>
    <div class="card">
      <div class="chalg">👻</div>
      <h2 id="chalT"></h2>
      <p id="chalP" class="lbnote"></p>
      <button id="chalGo" class="big" data-t="chalGo"></button>
      <button id="chalNo" class="sm" data-t="profLater"></button>
    </div>
  </section>
  <section id="profS" class="screen dim" hidden>
    <div class="card">
      <h2 data-t="profT"></h2>
      <p class="lbnote" data-t="profP"></p>
      <label class="pf"><span data-t="lbYourName"></span><input id="pfName" maxlength="16" autocomplete="nickname" enterkeyhint="done"></label>
      <label class="pf"><span data-t="lbCityL"></span><select id="pfCity"></select></label>
      <p id="pfMsg" class="lbnote warn"></p>
      <button id="pfGo" class="big" data-t="profGo"></button>
      <button id="pfLater" class="sm" data-t="profLater"></button>
    </div>
  </section>
  <section id="langS" class="screen dim" hidden>
    <div class="card">
      <h2>भाषा · Language</h2>
      <p class="lbnote">अपनी भाषा चुनें · अपन भाषा चुनू · Choose your language</p>
      <button class="big lgb" data-lang3="mai">मैथिली<small>मैथिली मे खेलू</small></button>
      <button class="big lgb" data-lang3="hi">हिंदी<small>हिंदी में खेलें</small></button>
      <button class="big lgb" data-lang3="en">English<small>Play in English</small></button>
    </div>
  </section>

  <section id="dailyS" class="screen dim" hidden>
    <div class="card">
      <h2 data-t="daily"></h2>
      <p class="lbnote" data-t="dailySub"></p>
      <div id="dailyDays" class="days"></div>
      <button id="dailyGet" class="big"></button>
    </div>
  </section>

  <div id="loading" class="screen">
    <img src="img/logo.webp" alt="MB Sweets" width="120" height="110">
    <div id="loadbar"><i></i></div>
    <p id="loadmsg" data-t="loading">Loading…</p>
  </div>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
