.witem.lock b{filter:grayscale(.2)}
.witem.prev{box-shadow:0 0 0 3px var(--haldi)}
.wbuy{margin-top:2px;font:800 13px var(--disp);background:var(--haldi);border:2px solid var(--ink);border-radius:10px;padding:3px 7px 1px;display:flex;align-items:center;gap:3px}
.wbuy.poor{opacity:.55}
.wbuy .rg{width:13px;height:13px;border-width:2px}
#wardClose{flex:none}
.unlockcard{position:relative;overflow:hidden;z-index:2}
.unlockcard small{font:800 16px var(--disp);color:var(--sindoor);letter-spacing:.5px}
.unicon{font-size:96px;line-height:1.1;animation:unpop 1s cubic-bezier(.2,1.6,.4,1) both,unbob 1.6s 1s ease-in-out infinite alternate}
.unglow{position:absolute;left:50%;top:38%;width:340px;height:340px;margin:-170px 0 0 -170px;background:repeating-conic-gradient(#F2A91B44 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;z-index:-1}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes unpop{0%{transform:scale(0) rotate(-30deg)}100%{transform:scale(1) rotate(0)}}
@keyframes unbob{to{transform:translateY(-8px) rotate(4deg)}}

#unlockS{z-index:6}
.metacard{gap:10px;height:min(92vh,660px)}
#metaClose{flex:none;margin-top:2px}
.mhead{align-self:stretch;display:flex;gap:8px;align-items:center}
.mhead .seg{flex:1}
#metaWallet{margin:0}
#metaBody{align-self:stretch;overflow:auto;flex:1;min-height:160px;display:flex;flex-direction:column;gap:8px;text-align:left;padding:2px}
#metaBody h3{font:800 19px var(--disp);color:var(--maroon);text-align:center;margin-top:4px}
.ms{background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px 6px}
.ms.done{background:#E9F8E4}
.mst{font:700 16px/1.25 var(--body)}
.msb{height:12px;border:2px solid var(--ink);border-radius:99px;background:#f3e6c8;overflow:hidden;margin:6px 0 4px}
.msb i{display:block;height:100%;background:linear-gradient(90deg,var(--haldi),var(--sindoor))}
.ms.done .msb i{background:var(--leaf)}
.msr{display:flex;justify-content:space-between;align-items:center;font:700 13px var(--body);color:#6b4a3a}
.msr em{font:800 14px var(--disp);font-style:normal;color:var(--maroon);display:flex;align-items:center;gap:4px}
.msr .rg,.upb .rg,#dailyGet .rg{width:16px;height:16px;border-width:2px;vertical-align:-2px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;align-self:stretch}
.day{background:#fff;border:2px solid var(--ink);border-radius:10px;text-align:center;padding:3px 0 1px}
.day small{display:block;font:700 10px var(--body);color:#7a6152;white-space:nowrap}
.day b{font:800 14px var(--disp);color:var(--maroon)}
.day.got{background:#E9F8E4}.day.got b{color:var(--leaf)}
.day.now{background:var(--haldi);animation:pulse .6s ease-in-out infinite alternate}
.big.mini{font-size:22px;padding:7px 14px 4px}
.up{display:flex;align-items:center;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px}
.upi{font-size:26px;width:38px;text-align:center}
.upm{flex:1;min-width:0}
.upn{font:800 17px var(--disp)}
.upm small{font:700 13px var(--body);color:#6b4a3a}
.pips{display:flex;gap:3px;margin:2px 0}
.pips i{width:18px;height:8px;border-radius:4px;background:#e8dcc0;border:1.5px solid var(--ink)}
.pips i.on{background:var(--sindoor)}
.upb{font:800 16px var(--disp);background:var(--haldi);border:2.5px solid var(--ink);border-radius:12px;padding:7px 10px 4px;box-shadow:0 3px 0 var(--ink);display:flex;align-items:center;gap:4px;white-space:nowrap}
.upb.poor{opacity:.55}
.upb.max{background:var(--leaf);color:#fff}
.st{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border:2.5px solid var(--ink);border-radius:14px;padding:8px 10px;font:700 16px var(--body)}
.st.col{flex-direction:column;align-items:stretch}
.tg{min-width:74px;font:800 15px var(--disp);border:2.5px solid var(--ink);border-radius:99px;padding:5px 12px 2px;background:#e8dcc0}
.tg.on{background:var(--leaf);color:#fff}
.msgain{font:800 17px var(--disp);color:var(--leaf);background:#E9F8E4;border:2.5px solid var(--leaf);border-radius:12px;padding:4px 12px 2px}
#metaS,#dailyS{z-index:5}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-height: 520px){.card{padding:14px 16px 12px;gap:8px}.card h2{font-size:22px}.big-score{font-size:44px}.big{font-size:24px;padding:7px 14px 4px}
  .stats b{font-size:20px}.revn{width:64px;height:64px;font-size:34px}.days{gap:3px}.lbcard{max-height:96vh}}
@media (min-aspect-ratio: 4/3){.titlewrap{margin-top:4px}.ttl{font-size:clamp(44px,8vw,84px)}}

/* 🏁 गेम-ओवर — एक ही स्क्रीन में (24 नवंबर, मालिक: "बहुत लंबा पेज… पूरा मोबाइल में दिखता भी नहीं") */
#over{overflow-y:auto;justify-content:safe center}
#over .card{gap:7px;padding:12px 14px 12px}
#over .card h2{font-size:clamp(20px,5.6vw,25px)}

#over .big-score{font-size:clamp(40px,12vw,50px)}
#over .stats{gap:8px}#over .stats>div{padding:2px 6px 1px;border-width:2.5px;border-radius:12px}#over .stats small{font-size:11.5px}#over .stats b{font-size:19px}
#over .orate{padding:4px 8px 4px 10px;border-width:2.5px;border-radius:13px;font-size:14px;flex-wrap:nowrap}
#over .orate span{white-space:normal;line-height:1.1;font-size:13.5px}
#over .orate .ostars{flex:none;flex-basis:auto;order:0}
#over .orate .ost{font-size:clamp(22px,6.6vw,28px)}
#over .big{font-size:clamp(24px,6.6vw,30px);padding:9px 14px 6px}
#over .row .sm{font-size:14.5px;padding:6px 8px 3px}
.oxtra{width:100%;display:flex;flex-direction:column;gap:6px}
.oxtra:empty{display:none}
#over .msgain{font-size:13.5px;line-height:1.3;padding:3px 10px 2px;border-radius:10px}

#over #overRw b{font-size:15px}

#over .opc-box>b{font-size:13.5px;display:flex;justify-content:space-between;gap:6px}
#over .opc-box>b::after{content:'›';font-size:18px;line-height:.8}
#over .opc-box .opcs{display:none}#over .opc-box.open .opcs{display:flex}#over .opc-box.open>b::after{content:'⌄'}
#over .rgbtn.wide2{padding:4px 8px 3px;border-width:2.5px;margin:0}#over .rgbtn.wide2 b{font-size:15px}#over .rgbtn.wide2 small{font-size:11px}
#over .oshot{padding:4px 6px;border-width:2.5px}#over .oshot img{width:40px;height:50px}#over .oshot span{font-size:13px}#over .oshot .sm{font-size:12.5px;padding:4px 6px 2px}
#over .shopcard{margin-top:8px;padding:6px 10px;gap:9px;border-radius:14px;border-width:3px}
#over .shopcard img{width:38px}#over .shopcard b{font-size:15px}#over .shopcard small{display:none}#over .shopcard em{margin-top:2px;font-size:13px;padding:1px 10px 0}
@media (min-aspect-ratio:4/3) and (min-width:640px){#over .card{width:min(94vw,760px);display:grid;grid-template-columns:1fr 1fr;column-gap:14px;align-items:start;justify-items:center}
  #over .card>*:not(.oxtra){grid-column:1}#over .oxtra{grid-column:2;grid-row:1/span 9;align-self:center}#over .shopcard{width:min(94vw,760px)}}
@media (max-height:640px){#over .card{gap:5px;padding:10px 12px}#over .big-score{font-size:38px}#over .card h2{font-size:19px}#over .shopcard{display:none}}

/* 🎭 किरदार + 🎁 तोहफ़े (24 नवंबर) */
.witem .wpow{display:block;font:700 10.5px/1.15 var(--body);font-style:normal;color:#2E7B47;margin-top:1px}
#over .onext{align-self:stretch;margin:2px 0 6px;padding:6px 10px;border-radius:12px;background:#FFF3C4;border:2px dashed #E0A21B;color:#7A3B00;font:800 13.5px/1.25 var(--disp);text-align:center}
#unIcon.shake{display:inline-block;animation:gshake .28s ease-in-out infinite}
#unIcon.pop{display:inline-block;animation:gpop .5s cubic-bezier(.2,1.6,.4,1)}
@keyframes gshake{0%,100%{transform:rotate(0) scale(1)}25%{transform:rotate(-12deg) scale(1.05)}75%{transform:rotate(12deg) scale(1.05)}}
@keyframes gpop{0%{transform:scale(.2)}100%{transform:scale(1)}}
#wardTabs{flex-wrap:wrap}

/* 🏠 नया होम (24 नवंबर) — बीच में किरदार, दोनों ओर गोल आइकन, नीचे किरदार बदलो + खेलो */
#menu{overflow:hidden;padding:0!important}
#menu .mtop{position:absolute;left:0;right:0;top:max(8px,env(safe-area-inset-top));display:flex;align-items:flex-start;justify-content:space-between;gap:6px;padding:0 8px;pointer-events:none}
#menu .mtop>*{pointer-events:auto}
#menu .mstat{flex:none;min-width:70px;text-align:center;background:#fff8e8;border:2.5px solid var(--ink);border-radius:14px;padding:3px 8px 1px;box-shadow:0 3px 0 var(--ink)}
#menu .mstat small{display:block;font:700 11px var(--body);color:var(--maroon)}#menu .mstat b{display:block;font:800 18px/1.1 var(--disp);color:var(--ink)}
#menu .mlogo{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
#menu .mlogo .brand{font-size:12px;padding:1px 10px 0 3px}#menu .mlogo .brand img{width:26px}
#menu .mlogo .ttl{font-size:clamp(30px,9.2vw,56px)}
#menu .mlogo .sub{font-size:12px;margin:0}
#menu .mlogo .sub.fest,#menu .mlogo .sub.wx{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;padding:2px 8px}
#menu .mside{position:absolute;top:calc(max(8px,env(safe-area-inset-top)) + 150px);display:flex;flex-direction:column;gap:9px;z-index:2}
#menu .mside.L{left:max(6px,env(safe-area-inset-left))}#menu .mside.R{right:max(6px,env(safe-area-inset-right))}
.mic{position:relative;width:64px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none!important;border:0!important;box-shadow:none!important;padding:0!important;margin:0;font:800 11px/1.1 var(--disp);color:#fff;cursor:pointer}
.mic>i{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fffaf0,#ffd76a 70%,#f2a91b);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);font-style:normal;font-size:25px;line-height:1}
.mic>span{background:#2a1511d9;border-radius:8px;padding:2px 6px 1px;white-space:nowrap;max-width:76px;overflow:hidden;text-overflow:ellipsis}
.mic>span b{font:inherit}
.mic{height:auto!important;border-radius:0!important;flex:none}.mic>i{position:relative!important;top:auto!important;right:auto!important;min-width:0!important;color:inherit;font-weight:400}
.mic .bd,.mic.gsbtn>i>i,.mic.rwbtn>i>i{position:absolute!important}.mic.rwbtn>small{font:700 9.5px/1.1 var(--body);color:#fff;background:#7a111ad9;border:0;margin:0;padding:1px 4px;border-radius:6px}
.mic>small{font:700 9.5px/1.1 var(--body);color:#fff;background:#7a111ad9;border-radius:6px;padding:1px 4px;white-space:nowrap}
.mic:active>i{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.mic.rg>i{background:radial-gradient(circle at 35% 28%,#fff,#ffc2d4 70%,#f07aa0)}
#btnDaily>small{display:none}
.mic .bd,.mic.gsbtn>i>i,.mic.rwbtn>i>i{position:absolute;top:-4px;right:2px;font:800 11px/18px var(--disp);font-style:normal;min-width:18px;height:18px;border-radius:9px;background:var(--sindoor);color:#fff;border:2px solid var(--ink)}
#menu .mbottom{position:absolute;left:0;right:0;bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;padding:0 12px;z-index:2}
#menu .mbottom .big{width:min(100%,380px);margin:0}
#menu .mchar{display:flex;align-items:center;justify-content:center;gap:8px;width:min(100%,380px)}
.charr{flex:none;width:46px;height:46px;border-radius:50%;border:3px solid var(--ink);background:#fff8e8;font:800 30px/1 var(--disp);color:var(--maroon);box-shadow:0 3px 0 var(--ink);padding:0 0 4px}
.charr:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.chinfo{flex:1;min-width:0;text-align:center;background:#fff8e8ee;border:2.5px solid var(--ink);border-radius:14px;padding:4px 8px 4px;box-shadow:0 3px 0 var(--ink)}
#chName{display:block;font:800 21px/1.1 var(--disp);color:var(--maroon)}
#chPow{display:block;font:700 12px/1.2 var(--body);color:#2E7B47}
#chState{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin-top:2px;font:700 11.5px/1.2 var(--body);color:#5a3a22}
#chState .chok{color:#2E7B47;font-weight:800}
#chState button{font:800 12px/1 var(--disp);border:2px solid var(--ink);border-radius:999px;padding:4px 10px 2px;background:#ffe27a;color:var(--ink);box-shadow:0 2px 0 var(--ink)}
#chState button.poor{opacity:.55}
#menu .hschip{width:min(100%,380px);margin:0;padding:3px 10px 1px;font-size:13px}
#menu #btnPlay.try{background:linear-gradient(#5fd38a,#2e9b57);font-size:clamp(20px,6vw,28px)}
#menu .tiny{margin:0}
@media (max-height:700px){.mic>i{width:44px;height:44px;font-size:21px}#menu .mside{gap:5px;top:calc(max(8px,env(safe-area-inset-top)) + 128px)}#menu .mlogo .sub:not(.fest){display:none}#menu .mlogo .ttl{font-size:clamp(28px,8.4vw,48px)}.charr{width:40px;height:40px;font-size:26px}#chName{font-size:19px}}
@media (max-height:600px){#menu .mlogo .sub.fest,#menu .mlogo .sub.wx{display:none}.mic>span{font-size:10px}.mic>small{display:none}}
@media (min-aspect-ratio:4/3){#menu .mside{top:calc(max(8px,env(safe-area-inset-top)) + 110px)}#menu .mside.L{left:max(14px,env(safe-area-inset-left))}#menu .mside.R{right:max(14px,env(safe-area-inset-right))}}
@media (min-aspect-ratio:4/3) and (max-height:520px){#menu .mside{flex-wrap:wrap;max-height:calc(100vh - 120px)}#menu .mside.L,#menu .mside.R{top:74px}#menu .mlogo .ttl{font-size:30px}#menu .mlogo .sub{display:none}}
#menu.t1 .mic>small{display:none}#menu.t1 .mside{gap:4px}#menu.t1 .mic>i{width:46px;height:46px;font-size:22px}
#menu.t2 .mic>i{width:40px;height:40px;font-size:19px}#menu.t2 .mic>span{font-size:9.5px;padding:1px 4px 0}#menu.t2 .mside{gap:3px}
#menu.t3 .mic>span{display:none}#menu.t3 .mic>i{width:38px;height:38px;font-size:18px}#menu.t3 .mic{width:46px}
@media (min-aspect-ratio:4/3) and (max-height:560px){#menu .mbottom{flex-direction:row;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px}#menu .mchar{width:min(54%,380px)}#menu .mbottom .big{width:min(36%,280px);font-size:26px;padding-top:10px;padding-bottom:6px}#menu .tiny{display:none}#menu .hschip{order:-1;flex-basis:100%;width:auto;max-width:380px}#chPow{display:none}}
#newS{z-index:59}.newcard{max-width:420px}.newl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px;text-align:left;font:700 14.5px/1.3 var(--body);color:var(--ink)}
.newl li{background:#fff8e8;border:2px solid var(--ink);border-radius:12px;padding:6px 10px}
</style>

<body>
<div id="app">
  <canvas id="c"></canvas>
  <div id="mbFrame"></div>

  <div id="hud" hidden>
    <div class="top">
      <button id="btnPause" class="ib" aria-label="Pause">❚❚</button>
      <div id="pu"></div>
      <div class="scorebox">
        <div id="scoreV">0</div>
        <div id="multV" class="multv" hidden></div>
        <div class="sw"><i class="rg"></i><span id="sweetsV">0</span></div>
      </div>

    <div id="order" hidden></div>
    <div id="pcard" hidden></div>
    <div id="beat" hidden><b>🥁</b><span></span></div>
    <div id="combo" hidden></div>
    <div class="bottom">
      <div id="meter"><i></i><span>⚡</span></div>
      <button id="btnRush" data-t="rushBtn" hidden></button>
    </div>
  </div>
  <div id="hint" hidden></div>
  <div id="fsHint" hidden></div>
  <div id="vig"></div>
  <div id="toast"></div>
  <div id="lvl"></div>
  <div id="trWarn"><i></i><i></i><i></i></div>

  <section id="menu" class="screen" hidden>
    <!-- 🏠 होम (24 नवंबर, मालिक: "होम पेज पर करेक्टर दिखना चाहिए, ऑप्शन साइड में") — बीच में किरदार, दोनों ओर गोल आइकन, नीचे खेलो -->
    <div class="mtop">
      <div class="mstat"><small data-t="best"></small><b id="bestV">0</b></div>

        <div class="brand"><img src="img/logo.webp" alt="" width="38" height="35"><span data-t="brandTag">MB Sweets · दरभंगा</span></div>

        <p class="sub" data-t="sub"></p>
        <p id="festTag" class="sub fest" hidden></p>
        <p id="wxTag" class="sub wx" hidden></p>
      </div>
      <div class="mstat"><small data-t="sweets"></small><b id="totalV">0</b></div>
    </div>
    <div class="mside L">
      <button id="btnStory" class="mic"><i>📖</i><span data-t="micStory"></span><small id="storySub"></small></button>
      <button id="btnDaily" class="mic" hidden><i>📅</i><span data-t="micDaily"></span><small id="dailySub"></small></button>
      <button id="btnRg" class="mic rg"><i>🍮</i><span><b data-t="micRg"></b></span><small id="rgSub"></small></button>
      <button id="btnLb" class="mic" hidden><i>🏆</i><span data-t="micLb"></span></button>
      <button id="btnRw" class="mic rwbtn rwon" hidden></button>
      <button id="btnRate" class="mic" hidden><i>⭐</i><span data-t="micRate"></span></button>
    </div>
    <div class="mside R">
      <button id="btnMs" class="mic"><i>🎯</i><span data-t="micMs"></span></button>
      <button id="btnWard" class="mic"><i>👕</i><span data-t="micWard"></span></button>
      <button id="btnUp" class="mic"><i>⬆️</i><span data-t="micUp"></span></button>
      <button id="btnShop" class="mic gsbtn"></button>
      <button id="btnSet" class="mic"><i>⚙️</i><span data-t="micSet"></span></button>
    </div>
    <div class="mbottom">
      <div class="mchar">
        <button id="chPrev" class="charr" aria-label="previous character">‹</button>
        <div class="chinfo"><b id="chName"></b><small id="chPow"></small><div id="chState"></div></div>
        <button id="chNext" class="charr" aria-label="next character">›</button>
